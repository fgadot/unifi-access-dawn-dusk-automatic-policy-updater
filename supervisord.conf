[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
logfile=/dev/null
logfile_maxbytes=0
loglevel=info

# ----- Web UI (Flask via gunicorn) -----------------------------------------
[program:webui]
command=gunicorn
    --bind 0.0.0.0:8080
    --workers 2
    --timeout 180
    --access-logfile -
    --error-logfile -
    app:app
directory=/app/web
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# ----- Cron runner (supercronic) -------------------------------------------
[program:cron]
command=/usr/local/bin/supercronic -passthrough-logs /app/crontab
autostart=true
autorestart=true
startretries=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
