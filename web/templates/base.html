<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}UniFi Access Dawn/Dusk{% endblock %}</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #f6f8fa; }
    .container-narrow { max-width: 720px; }
    .navbar-brand { font-weight: 600; }
    .card { border: none; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
    code.config-value { background: #eef2f7; padding: 2px 6px; border-radius: 4px;
                       font-size: .9em; }
    pre.log { background: #1e1e1e; color: #ddd; padding: 1em; border-radius: 6px;
              font-size: .82em; max-height: 400px; overflow: auto;
              font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .footer-link { color: #6c757d; text-decoration: none; }
    .footer-link:hover { color: #0d6efd; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container container-narrow">
      <span class="navbar-brand mb-0">
        <i class="bi bi-sun-fill text-warning me-1"></i>
        UniFi Access Dawn/Dusk
      </span>
      <span class="navbar-text small text-light opacity-75">
        v2.0.1
      </span>
    </div>
  </nav>

  <main class="container container-narrow pb-5">
    {% block content %}{% endblock %}
  </main>

  <footer class="container container-narrow text-center pb-4 small">
    <a class="footer-link"
       href="https://github.com/fgadot/unifi-access-dawn-dusk-automatic-policy-updater"
       target="_blank">
      <i class="bi bi-github"></i> GitHub
    </a>
    <span class="text-muted mx-2">&middot;</span>
    <span class="text-muted">Made by Frank Gadot</span>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
